services:
  mc:
    image: itzg/minecraft-server:latest
    pull_policy: daily
    tty: true
    stdin_open: true
    ports:
      - "25565:25565"
      - "24454:24454/udp" # For the Voice Chat Mod
    environment:
      EULA: "TRUE"
      ONLINE_MODE: "FALSE"
      VERSION: "26.1.2"
      TYPE: "FABRIC"
      TZ: "America/Mexico_City"
      MOD_PLATFORM: "MODRINTH"
      MODRINTH_MODPACK: "/data/server.mrpack"
      INIT_MEMORY: "2G"
      MAX_MEMORY: "6.5G"
      USE_AIKAR_FLAGS: "TRUE"
      VIEW_DISTANCE: "8"
      SIMULATION_DISTANCE: "6"
      MODE: "survival"
      DIFFICULTY: "hard"
      ICON: "https://assets.magni.dev/icons/650x650-rounded.svg"
      # Bump this version number whenever you update the server.mrpack
      # This forces Dokploy to recreate and restart the container automatically!
      MODPACK_VERSION: "1.0.0"
      OPS: |
        fermeridamagni
    volumes:
      - minecraft_data:/data
      - ./assets/server.mrpack:/data/server.mrpack:ro

volumes:
  minecraft_data:
