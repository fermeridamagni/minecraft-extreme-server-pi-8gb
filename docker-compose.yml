services:
  mc:
    image: itzg/minecraft-server:latest
    pull_policy: daily
    tty: true
    stdin_open: true
    ports:
      - "25565:25565"
      - "24454:24454/udp" # For the Voice Chat Mod
    environment:
      EULA: "TRUE"
      ONLINE_MODE: "FALSE"
      VERSION: "26.1.2"
      TYPE: "FABRIC"
      MOD_PLATFORM: "MODRINTH"
      MODRINTH_MODPACK: "/data/server.mrpack"
      INIT_MEMORY: "2G"
      MAX_MEMORY: "6G"
      MODE: "survival"
      DIFFICULTY: "hard"
      ICON: "https://assets.magni.dev/icons/650x650-rounded.svg"
      OPS:  "fermeridamagni"
    volumes:
      - ./data:/data
      - ./assets/server.mrpack:/data/server.mrpack:ro
